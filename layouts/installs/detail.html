{{ define "main" }}
<style>
  .detail-container { max-width: 960px; margin: 0 auto; padding: 20px 0 60px; }
  .detail-container > h1 { font-size: 24px; margin: 0 0 14px; }
  .detail-map { position: relative; margin: 0 0 24px; height: min(85vh, 820px); min-height: 460px; overflow: hidden; background: #fff; border: 1px solid var(--rule); touch-action: none; cursor: grab; }
  .detail-map.dragging { cursor: grabbing; }
  .detail-map svg { width: 100%; height: 100%; display: block; }
  .detail-controls { position: absolute; left: 12px; top: 12px; z-index: 2; display: flex; background: var(--bg); border: 1px solid var(--rule); }
  .detail-controls button { min-width: 42px; min-height: 42px; padding: 7px; border: 0; background: transparent; color: var(--text); cursor: pointer; }
  .detail-controls button:hover, .detail-controls button:focus-visible { background: var(--rule); }
  .detail-prompt { font: 12px/1.5 var(--mono); color: var(--muted); margin-bottom: 18px; }
  .detail-locations { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 5px 20px; margin: 0 0 32px; }
  .detail-location-button { text-align: left; color: var(--text); background: transparent; border: 1px solid var(--rule); cursor: pointer; padding: 10px; font: 12px/1.4 var(--mono); }
  .detail-location-button:hover, .detail-location-button:focus-visible, .detail-location-button.selected { background: var(--rule); }
  .detail-hotspot { fill: transparent; stroke: transparent; stroke-width: 2; vector-effect: non-scaling-stroke; cursor: pointer; }
  .detail-hotspot:hover, .detail-hotspot:focus-visible, .detail-hotspot.selected { fill: #c6f50066; stroke: #7b9300; outline: none; }
  .detail-gallery[hidden] { display: none; }
  .detail-gallery-link { display: inline-block; margin: 6px 0 18px; font: 12px var(--mono); }


  .detail-gallery { margin-top: 32px; }

  .detail-gallery-title {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 16px;
  }

  .detail-back {
    display: inline-block;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--hover);
    text-decoration: none;
    border-bottom: 1px solid rgba(198,245,0,0.4);
    padding-bottom: 2px;
    margin-top: 48px;
    display: block;
  }

  @media (max-width: 600px) {
    .detail-container { padding: 8px 0 30px; }
    .detail-map { height: 65vh; min-height: 360px; }
    .detail-locations { grid-template-columns: 1fr; }
  }
</style>

<div class="detail-container">
  <h1>{{ .Title }}</h1>
  <p class="detail-prompt">Select a letter or a location below. Scroll or pinch to zoom; drag to move around.</p>
  <div class="detail-map" id="mapWrap">
    <div class="detail-controls"><button type="button" id="detailZoomIn" aria-label="Zoom in">+</button><button type="button" id="detailZoomOut" aria-label="Zoom out">-</button><button type="button" id="detailReset" aria-label="Reset map">Reset</button></div>
    {{ readFile "static/images/maps/cressingham-interactive.svg" | safeHTML }}
  </div>

  <h2 class="detail-gallery-title">Locations</h2>
  <div class="detail-locations" id="detailLocations"></div>
  <div class="detail-gallery" id="galleryWrap" aria-live="polite" hidden></div>

  <a href="/installs/" class="detail-back">← Back to installs</a>
</div>

<script id="detailMapData" type="application/json">{{ .Params.map_locations | jsonify | safeJS }}</script>
<script src="{{ "JS/cressingham-map.js" | relURL }}" defer></script>
{{ end }}
