<footer class="site-footer">

  <div class="footer-body">
    <div class="footer-left">
      {{ with .Site.Params.tagline }}<p class="footer-tagline">{{ . }}</p>{{ end }}
      {{ with .Site.Params.footer_project }}<p class="footer-desc">{{ . }}</p>{{ end }}
    </div>
    <nav class="footer-nav" aria-label="Site navigation">
      <a href="/exhibition/"{{ if eq .RelPermalink "/exhibition/" }} class="active"{{ end }}>Exhibition</a>
      <a href="/quotes/"{{ if eq .RelPermalink "/quotes/" }} class="active"{{ end }}>Quotes</a>
      <a href="/map/"{{ if eq .RelPermalink "/map/" }} class="active"{{ end }}>Map</a>
      <a href="/about/"{{ if eq .RelPermalink "/about/" }} class="active"{{ end }}>About</a>
    </nav>
  </div>

  <div class="footer-base">
    <div class="footer-base-left">
      <p class="footer-contact-averia"><a href="mailto:{{ .Site.Params.email | default "info@enricopolicardo.com" }}">{{ .Site.Params.email | default "info@enricopolicardo.com" }}</a> &nbsp;·&nbsp; <a href="https://enricopolicardo.com" target="_blank" rel="noopener">enricopolicardo.com</a></p>
      <p class="footer-copyright">© Enrico Policardo 2026</p>
    </div>
    <div class="footer-ace">
      <a href="https://www.artscouncil.org.uk/dycp" target="_blank" rel="noopener"><img src="/images/lottery_Logo_Black_RGB.png" alt="Supported using public funding by Arts Council England"></a>
    </div>
  </div>

</footer>
