{{ define "main" }}
<style>
  :root:has(.pdf-reader) { --bg: #111; --text: #f7f5f0; --muted: #b5b5b5; --rule: #505050; --link: #f7f5f0; --hover: #fff; color-scheme: dark; }
  body:has(.pdf-reader) { background: var(--bg); color: var(--text); }
  .wrap:has(.pdf-reader) { max-width: 1240px; }
  .publication-heading { margin: 0 0 20px; }
  .publication-heading h2 { font-size: clamp(25px, 3vw, 34px); margin: 0 0 8px; }
  .publication-heading p { font-size: 16px; color: var(--muted); margin: 0; }
  .pdf-reader { background: var(--bg); color: var(--text); }
  .pdf-reader button, .pdf-reader select, .pdf-reader input, .pdf-reader a { font-family: var(--mono); font-size: 12px; }
  .pdf-reader button, .pdf-reader select, .pdf-reader input { min-height: 44px; border: 1px solid var(--rule); border-radius: 0; padding: 9px 11px; background: transparent; color: inherit; }
  .pdf-reader button { cursor: pointer; }
  .pdf-reader button:hover:not(:disabled) { background: #292929; }
  .pdf-reader button:disabled { opacity: .35; cursor: default; }
  .pdf-reader :focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }
  .reader-toolbar { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 12px 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); align-items: center; }
  .reader-group { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .reader-group label { font-family: var(--mono); font-size: 11px; }
  .reader-group input { width: 64px; }
  .reader-count { font-family: var(--mono); font-size: 12px; min-width: 102px; text-align: center; }
  .reader-stage { height: min(78svh, 880px); min-height: 280px; overflow: auto; overscroll-behavior: contain; margin-top: 16px; background: #080808; touch-action: pan-x pan-y pinch-zoom; }
  .reader-pages { display: flex; align-items: center; justify-content: center; width: max-content; min-width: 100%; min-height: 100%; gap: 0; }
  .reader-pages canvas { flex: none; display: block; background: #fff; max-width: none; }
  .reader-status { min-height: 24px; font-family: var(--mono); color: var(--muted); font-size: 12px; margin: 12px 0; }
  .reader-hint { font-family: var(--mono); font-size: 11px; color: var(--muted); margin: 12px 0 24px; }
  .reader-original { display: inline-flex; align-items: center; min-height: 44px; }
  .pdf-reader:fullscreen { display: flex; flex-direction: column; padding: 16px; overflow: auto; }
  .pdf-reader:fullscreen .reader-stage { height: auto; flex: 1; min-height: 200px; }
  .pdf-reader:fullscreen .reader-hint { margin-bottom: 0; }
  @media (max-width: 600px) {
    .reader-toolbar { align-items: stretch; gap: 8px; }
    .reader-toolbar > .reader-group { width: 100%; justify-content: space-between; gap: 6px; }
    .reader-stage { height: 66svh; min-height: 250px; }
    .reader-group input { width: 56px; }
    .reader-hint { line-height: 1.6; }
  }
</style>
<div class="publication-heading">
  <h2>{{ .Title }}</h2>
  {{ with .Params.intro }}<p>{{ . }}</p>{{ end }}
</div>
<section class="pdf-reader" id="pdf-reader" data-pdf-url="{{ .Params.pdf_url }}" aria-label="PDF reader" tabindex="0">
  <div class="reader-toolbar">
    <div class="reader-group">
      <button type="button" id="pdf-prev" aria-label="Previous page" disabled>← Previous</button>
      <span class="reader-count" id="pdf-count">Loading…</span>
      <button type="button" id="pdf-next" aria-label="Next page" disabled>Next →</button>
    </div>
    <div class="reader-group">
      <label for="pdf-page">Page</label>
      <input type="number" id="pdf-page" min="1" value="1" step="1" inputmode="numeric" disabled>
      <button type="button" id="pdf-go" disabled>Go</button>
      <label for="pdf-layout">View</label>
      <select id="pdf-layout" disabled><option value="auto">Auto</option><option value="single">One page</option><option value="spread">Two pages</option></select>
      <label for="pdf-zoom">Zoom</label>
      <select id="pdf-zoom" disabled><option value="1">Fit</option><option value="1.25">125%</option><option value="1.5">150%</option><option value="2">200%</option></select>
      <button type="button" id="pdf-fullscreen" hidden>Full screen</button>
    </div>
  </div>
  <p id="pdf-status" class="reader-status" role="status" aria-live="polite">Loading the PDF…</p>
  <div class="reader-stage" id="pdf-stage" aria-label="PDF pages" aria-busy="true"><div class="reader-pages" id="pdf-pages"></div></div>
  <div class="reader-group">
    <a class="reader-original" id="pdf-original" href="{{ .Params.pdf_url }}" target="_blank" rel="noopener">Open / download PDF ↗</a>
  </div>
  <p class="reader-hint">Previous / next, arrow keys, or swipe at Fit zoom. Zoom in to read the detail. The original PDF is available for text selection and accessible reading.</p>
  <noscript><p>JavaScript is needed for the online reader. Use the PDF link above to read or download the file.</p></noscript>
</section>
<script type="module" src="{{ "JS/pdf-reader.mjs" | relURL }}"></script>
{{ end }}
