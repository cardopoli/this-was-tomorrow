<header class="site-header">
    <h1><a href="{{ "/" | relURL }}">This Was Tomorrow</a></h1>
    {{ with .Site.Params.tagline }}
    <div class="tagline-row">
        <div class="tagline">{{ . }}</div>
        <nav class="header-nav">
            <a href="/exhibition/"{{ if eq $.RelPermalink "/exhibition/" }} class="active"{{ end }}>Exhibition</a>
            <a href="/map/"{{ if eq $.RelPermalink "/map/" }} class="active"{{ end }}>Map</a>
        </nav>
    </div>
    {{ end }}
</header>
