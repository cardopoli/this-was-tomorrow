{{ define "main" }}
<style>
  /* installs page — light theme with dark accents */
  .installs-container { max-width: 1200px; margin: 0 auto; padding: 48px 22px; }
  .installs-header { margin-bottom: 48px; }
  .installs-header h1 { font-size: 34px; font-weight: 800; margin-bottom: 12px; line-height: 1.05; }
  .installs-header p { font-size: 15px; line-height: 1.6; color: var(--muted); max-width: 60ch; }
  
  /* Grid of install cards */
  .installs-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 24px;
    margin-bottom: 48px;
  }

  .install-card {
    display: flex;
    flex-direction: column;
    background: var(--card);
    border: 1px solid var(--rule);
    cursor: pointer;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  
  .install-card:hover {
    border-color: var(--muted);
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }

  .install-card-image {
    position: relative;
    width: 100%;
    padding-bottom: 66%;
    background: var(--shade);
    overflow: hidden;
  }

  .install-card-image img {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  .install-card-image img.loaded {
    opacity: 1;
  }

  .install-card-body {
    padding: 20px;
    display: flex;
    flex-direction: column;
    flex: 1;
  }

  .install-card-title {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 6px;
    line-height: 1.3;
  }

  .install-card-meta {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.5px;
    margin-bottom: 12px;
  }

  .install-card-date {
    font-size: 13px;
    color: var(--text);
    margin-top: auto;
    padding-top: 12px;
    border-top: 1px solid var(--rule);
  }

  .install-status {
    display: inline-block;
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 3px 6px;
    border-radius: 2px;
    margin-left: 8px;
  }

  .install-status.live {
    background: #f0ede8;
    color: #077533;
  }

  .install-status.upcoming {
    background: #f0ede8;
    color: #8c8880;
  }

  /* Modal */
  .modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 100;
    overflow-y: auto;
    padding: 20px;
  }

  .modal.open {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .modal-content {
    background: var(--card);
    max-width: 600px;
    width: 100%;
    border: 1px solid var(--rule);
    max-height: 90vh;
    overflow-y: auto;
  }

  .modal-close {
    position: sticky;
    top: 0;
    display: flex;
    justify-content: flex-end;
    padding: 12px;
    border-bottom: 1px solid var(--rule);
    background: var(--card);
    z-index: 1;
  }

  .modal-close-btn {
    background: none;
    border: 1px solid var(--rule);
    padding: 6px 12px;
    font-family: var(--mono);
    font-size: 11px;
    cursor: pointer;
    color: var(--muted);
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .modal-close-btn:hover {
    border-color: var(--text);
    color: var(--text);
  }

  .modal-body {
    padding: 40px 32px;
  }

  .modal-header {
    margin-bottom: 28px;
  }

  .modal-title {
    font-size: 28px;
    font-weight: 800;
    line-height: 1.1;
    margin-bottom: 8px;
  }

  .modal-meta {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px;
    word-break: break-word;
  }

  .modal-date {
    font-size: 14px;
    color: var(--text);
    margin-bottom: 4px;
    word-break: break-word;
  }

  .modal-info {
    font-size: 14px;
    line-height: 1.7;
    margin-bottom: 32px;
    color: var(--text);
    word-break: break-word;
    overflow-wrap: break-word;
  }

  .modal-info p {
    margin-bottom: 12px;
  }

  .modal-embed {
    margin-bottom: 32px;
    border: 1px solid var(--rule);
    padding: 0;
    background: var(--shade);
    overflow: hidden;
    height: 500px;
  }

  .modal-embed iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }

  .modal-link {
    display: inline-block;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--hover);
    text-decoration: none;
    border-bottom: 1px solid rgba(198,245,0,0.4);
    padding-bottom: 2px;
  }

  .modal-link:hover {
    border-color: var(--hover);
  }

  @media (max-width: 600px) {
    .installs-container { padding: 32px 16px; }
    .installs-header h1 { font-size: 28px; }
    .installs-grid { grid-template-columns: 1fr; gap: 16px; }
    .modal-body { padding: 28px 20px; }
    .modal-title { font-size: 22px; }
  }

  /* respect reduced-motion */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: 0.01ms !important; }
  }
</style>

<div class="installs-container">
  <div class="installs-header">
    <h1>{{ .Title }}</h1>
    {{ if .Params.description }}<p>{{ .Params.description }}</p>{{ end }}
  </div>

  <div class="installs-grid">
    {{ range .Params.installs }}
      {{ partial "installs/card" . }}
    {{ end }}
  </div>
</div>

{{ partial "installs/modal" . }}

<script>
  // Make installs data available to modal JS
  window.installsData = {
    {{ range $i, $install := .Params.installs }}
      {{ if $i }},{{ end }}
      "{{ $install.site_link }}": {
        title: {{ $install.title | jsonify }},
        venue: {{ $install.venue | jsonify }},
        location: {{ $install.location | jsonify }},
        date_range: {{ $install.date_range | jsonify }},
        status: {{ $install.status | jsonify }},
        info: {{ $install.info | jsonify }},
        embed_code: {{ $install.embed_code | jsonify }},
        site_link: {{ $install.site_link | jsonify }}
      }
    {{ end }}
  };
</script>

<script src="{{ "JS/installs-modal.js" | relURL }}"></script>
{{ end }}
